name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # git comes with the runner; the tests use it to build a sample repository as a fixture.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build the extension package
        run: npm run package -w apps/vscode

      - uses: actions/upload-artifact@v4
        with:
          name: diffline-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
